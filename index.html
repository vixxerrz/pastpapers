<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maan's Past Paper Selector</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        :root {
            --bg-color: #030805;
            /* Ultra-transparent base so background elements remain clear */
            --card-bg: rgba(6, 20, 14, 0.17);
            --primary: #10b981;
            --accent-green: #34d399;
            --text-main: #ecfdf5;
            --border-color: rgba(52, 211, 153, 0.3);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --input-bg: rgba(4, 12, 8, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            overflow: hidden;
            position: relative;
            /* Enforces proper global render order for backdrop filters */
            isolation: isolate;
        }

        /* Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Frosted Glass Main Viewer Card */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            /* Hardware accelerated backdrop blur */
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--glass-highlight);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6), 
                0 0 30px rgba(16, 185, 129, 0.15),
                inset 0 1px 0 var(--glass-highlight);
            width: 100%;
            max-width: 480px;
            margin: auto;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.4rem;
            color: var(--accent-green);
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #d1fae5;
        }

        /* Translucent Inputs */
        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 10px;
            font-size: 1rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c34d399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        input {
            background-image: none;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 14px rgba(52, 211, 153, 0.5);
            background-color: rgba(9, 24, 16, 0.45);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-row .form-group {
            flex: 1;
        }

        .custom-input-group {
            display: none;
            margin-top: 8px;
        }

        /* Translucent Preview Box */
        .url-preview {
            background-color: rgba(4, 12, 8, 0.3);
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--glass-highlight);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            margin-bottom: 20px;
            color: var(--accent-green);
            max-height: 80px;
            overflow-y: auto;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-direction: row;
        }

        /* Buttons with Glassmorphism */
        button {
            flex: 1;
            padding: 14px 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 12px;
            cursor: pointer;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: transform 0.15s ease, background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-qp {
            background: rgba(52, 211, 153, 0.22);
            color: #ecfdf5;
            box-shadow: 0 4px 18px rgba(52, 211, 153, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .btn-qp:hover {
            background: rgba(52, 211, 153, 0.35);
            border-color: rgba(52, 211, 153, 0.6);
            box-shadow: 0 6px 22px rgba(52, 211, 153, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .btn-ms {
            background: rgba(16, 185, 129, 0.22);
            color: #ecfdf5;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .btn-ms:hover {
            background: rgba(16, 185, 129, 0.35);
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        @media (max-width: 400px) {
            .card {
                padding: 20px 16px;
            }

            .btn-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- Background Canvas for Floating Bubbles -->
<canvas id="bgCanvas"></canvas>

<div class="card">
    <h2>CAIE Past Paper Viewer</h2>

    <!-- Subject Selection -->
    <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" onchange="handleSubjectChange()">
            <option value="0620">Chemistry (0620)</option>
            <option value="0478">Computer Science (0478)</option>
            <option value="0610">Biology (0610)</option>
            <option value="0625">Physics (0625)</option>
            <option value="0510">English (0510)</option>
            <option value="0580">Maths (0580)</option>
            <option value="custom">Custom Code</option>
        </select>
        <div id="customSubjectGroup" class="custom-input-group">
            <input type="text" id="customSubject" placeholder="Enter 4-digit code (e.g., 0417)" oninput="updateUrlPreview()">
        </div>
    </div>

    <!-- Paper Selection -->
    <div class="form-group">
        <label for="paper">Paper Variant</label>
        <select id="paper" onchange="handlePaperChange()">
        </select>
        <div id="customPaperGroup" class="custom-input-group">
            <input type="text" id="customPaper" placeholder="Enter paper component (e.g., 22)" oninput="updateUrlPreview()">
        </div>
    </div>

    <div class="input-row">
        <!-- Year Selection -->
        <div class="form-group">
            <label for="year">Year</label>
            <select id="year" onchange="updateUrlPreview()">
                <option value="20">2020</option>
                <option value="21">2021</option>
                <option value="22">2022</option>
                <option value="23">2023</option>
                <option value="24">2024</option>
                <option value="25" selected>2025</option>
                <option value="26">2026</option>
            </select>
        </div>

        <!-- Session Selection -->
        <div class="form-group">
            <label for="session">Session</label>
            <select id="session" onchange="updateUrlPreview()">
                <option value="m">March (m)</option>
                <option value="s">May/June (s)</option>
                <option value="w" selected>Oct/Nov (w)</option>
            </select>
        </div>
    </div>

    <!-- URL Preview -->
    <label>Generated Link Preview:</label>
    <div class="url-preview" id="urlPreview"></div>

    <!-- Action Buttons -->
    <div class="btn-group">
        <button class="btn-qp" onclick="openPaper('qp')">Open QP (Question)</button>
        <button class="btn-ms" onclick="openPaper('ms')">Open MS (Marking)</button>
    </div>
</div>

<script>
    // Canvas animation for larger, brighter green bubbles
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const dots = [];
    const maxDots = 50;

    function createDot() {
        return {
            x: Math.random() * canvas.width,
            y: canvas.height + Math.random() * 40,
            // Larger radius so they remain clearly visible behind frosted glass
            radius: Math.random() * 6 + 3,
            speedY: Math.random() * 1.5 + 0.5,
            speedX: (Math.random() - 0.5) * 0.4,
            opacity: Math.random() * 0.7 + 0.3,
            fadeStart: canvas.height * (Math.random() * 0.3 + 0.1)
        };
    }

    for (let i = 0; i < maxDots; i++) {
        const d = createDot();
        d.y = Math.random() * canvas.height;
        dots.push(d);
    }

    function animateDots() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < dots.length; i++) {
            const d = dots[i];

            d.y -= d.speedY;
            d.x += d.speedX;

            let currentOpacity = d.opacity;
            if (d.y < d.fadeStart) {
                currentOpacity = (d.y / d.fadeStart) * d.opacity;
            }

            if (currentOpacity > 0.01) {
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(52, 211, 153, ${currentOpacity})`;
                ctx.shadowColor = 'rgba(52, 211, 153, 0.8)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset blur for performance
            }

            if (d.y + d.radius < 0 || currentOpacity <= 0.01) {
                dots[i] = createDot();
            }
        }

        requestAnimationFrame(animateDots);
    }
    animateDots();

    // Past Paper Selector Logic
    const paperPresets = {
        "0620": [
            { text: "MCQ (22)", value: "22" },
            { text: "Theory (42)", value: "42" },
            { text: "ATP (62)", value: "62" },
            { text: "Custom", value: "custom" }
        ],
        "0478": [
            { text: "Theory (12)", value: "12" },
            { text: "Programming (22)", value: "22" },
            { text: "Custom", value: "custom" }
        ],
        "0610": [
            { text: "MCQ (22)", value: "22" },
            { text: "Theory (42)", value: "42" },
            { text: "ATP (62)", value: "62" },
            { text: "Custom", value: "custom" }
        ],
        "0625": [
            { text: "MCQ (22)", value: "22" },
            { text: "Theory (42)", value: "42" },
            { text: "ATP (62)", value: "62" },
            { text: "Custom", value: "custom" }
        ],
        "0510": [
            { text: "Paper 12", value: "12" },
            { text: "Paper 22", value: "22" },
            { text: "Custom", value: "custom" }
        ],
        "0580": [
            { text: "Non-Calculator (22)", value: "22" },
            { text: "Calculator (42)", value: "42" },
            { text: "Custom", value: "custom" }
        ],
        "custom": [
            { text: "Custom", value: "custom" }
        ]
    };

    function handleSubjectChange() {
        const subject = document.getElementById('subject').value;
        const customSubjectGroup = document.getElementById('customSubjectGroup');
        const paperSelect = document.getElementById('paper');

        if (subject === 'custom') {
            customSubjectGroup.style.display = 'block';
        } else {
            customSubjectGroup.style.display = 'none';
        }

        paperSelect.innerHTML = '';
        const options = paperPresets[subject] || [{ text: "Custom", value: "custom" }];
        
        options.forEach(opt => {
            const el = document.createElement('option');
            el.value = opt.value;
            el.innerText = opt.text;
            paperSelect.appendChild(el);
        });

        handlePaperChange();
    }

    function handlePaperChange() {
        const paper = document.getElementById('paper').value;
        const customPaperGroup = document.getElementById('customPaperGroup');

        if (paper === 'custom') {
            customPaperGroup.style.display = 'block';
        } else {
            customPaperGroup.style.display = 'none';
        }

        updateUrlPreview();
    }

    function generateUrl(type) {
        const baseUrl = "https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/";
        
        let sub = document.getElementById('subject').value;
        if (sub === 'custom') {
            sub = document.getElementById('customSubject').value.trim();
        }

        let paper = document.getElementById('paper').value;
        if (paper === 'custom') {
            paper = document.getElementById('customPaper').value.trim();
        }

        const session = document.getElementById('session').value;
        const year = document.getElementById('year').value;

        sub = sub || "0000";
        paper = paper || "00";

        return `${baseUrl}${sub}_${session}${year}_${type}_${paper}.pdf`;
    }

    function updateUrlPreview() {
        const previewUrl = generateUrl('ms');
        document.getElementById('urlPreview').innerText = previewUrl;
    }

    function openPaper(type) {
        const targetUrl = generateUrl(type);
        window.open(targetUrl, '_blank');
    }

    handleSubjectChange();
</script>

</body>
</html>
