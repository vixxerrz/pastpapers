<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Level Percentage Calculator</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        body {
            min-height: 100vh;
            background: #0b1020;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            color: rgba(255, 255, 255, 0.92);
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 60px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 25% 20%, rgba(34, 197, 94, 0.25), transparent 50%),
                radial-gradient(circle at 75% 30%, rgba(22, 163, 74, 0.2), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.15), transparent 50%);
            filter: blur(40px);
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b1020;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: curtainReveal 2s ease-in-out forwards;
        }

        .intro-curtain-left,
        .intro-curtain-right {
            position: absolute;
            width: 50%;
            height: 100%;
            background: #0b1020;
        }

        .intro-curtain-left {
            left: 0;
            animation: slideLeft 1.5s ease-in-out 0.5s forwards;
        }

        .intro-curtain-right {
            right: 0;
            animation: slideRight 1.5s ease-in-out 0.5s forwards;
        }

        @keyframes slideLeft {
            to { transform: translateX(-100%); }
        }

        @keyframes slideRight {
            to { transform: translateX(100%); }
        }

        @keyframes curtainReveal {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }

        .background-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(34, 197, 94, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            padding: 2rem 1rem;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .title {
            color: rgba(255, 255, 255, 0.92);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .calc-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            animation: fadeInUp 0.8s ease-out;
            max-width: 600px;
            margin: 0 auto;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .select-label {
            display: block;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .select-field {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(11, 16, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .select-field:focus {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.3);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .label {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .weight-tag {
            color: rgba(34, 197, 94, 0.9);
            font-size: 0.8rem;
        }

        .input-field {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.3);
        }

        .result-box {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .result-value {
            color: rgba(34, 197, 94, 0.95);
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }

        .bottom-right-logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: auto;
            z-index: 100;
            opacity: 0.3;
            filter: invert(1);
        }

        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .calc-card { padding: 1.5rem; }
            .result-value { font-size: 2.5rem; }
        }

        @media (max-width: 480px) {
            .title { font-size: 1.4rem; letter-spacing: 0.05em; }
        }
    </style>
</head>
<body>
    <div class="intro-overlay">
        <div class="intro-curtain-left"></div>
        <div class="intro-curtain-right"></div>
    </div>

    <div class="background-particles" id="particles"></div>

    <div class="container">
        <h1 class="title">GRADE CALCULATOR</h1>
        <p class="subtitle">Select your subject and enter component marks to get your %</p>

        <div class="calc-card">
            <div class="form-group">
                <label for="subject" class="select-label">Subject</label>
                <select id="subject" class="select-field" onchange="handleSubjectChange()">
                    <option value="science">Science subjects</option>
                    <option value="maths">Maths</option>
                    <option value="english">English</option>
                    <option value="cs">Computer Science</option>
                </select>
            </div>

            <div id="componentsContainer"></div>

            <div class="result-box">
                <div class="result-label">Overall Percentage</div>
                <div class="result-value" id="finalResult">0.00%</div>
            </div>
        </div>
    </div>

    <img src="logo.png" alt="Logo" class="bottom-right-logo">

    <script>
        function createParticles() {
            const particlesContainer = document.getElementById("particles");
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                particle.style.left = Math.random() * 100 + "%";
                particle.style.top = Math.random() * 100 + "%";
                particle.style.animationDelay = Math.random() * 15 + "s";
                particle.style.animationDuration = (Math.random() * 10 + 10) + "s";
                particlesContainer.appendChild(particle);
            }
        }

        const subjectConfigs = {
            'science': [
                { id: 'atp', name: 'ATP', max: 40, weight: 0.20 },
                { id: 'mcq', name: 'MCQ', max: 40, weight: 0.30 },
                { id: 'theory', name: 'Theory', max: 80, weight: 0.50 }
            ],
            'maths': [
                { id: 'calc', name: 'Calc', max: 100, weight: 0.50 },
                { id: 'noncalc', name: 'Non calc', max: 100, weight: 0.50 }
            ],
            'english': [
                { id: 'rw', name: 'Reading and writing', max: 60, weight: 0.70 },
                { id: 'listening', name: 'Listening', max: 40, weight: 0.30 }
            ],
            'cs': [
                { id: 'cstheory', name: 'Theory', max: 75, weight: 0.50 },
                { id: 'programming', name: 'Programming', max: 75, weight: 0.50 }
            ]
        };

        function handleSubjectChange() {
            renderComponents();
        }

        function renderComponents() {
            const subjectVal = document.getElementById('subject').value;
            const container = document.getElementById('componentsContainer');
            const fields = subjectConfigs[subjectVal];

            let html = '';
            fields.forEach(field => {
                html += `
                    <div class="input-group">
                        <div class="label">
                            <span>${field.name} (out of ${field.max})</span>
                            <span class="weight-tag">${field.weight * 100}% Weight</span>
                        </div>
                        <input type="number"
                               id="${field.id}"
                               class="input-field"
                               placeholder="Enter marks (0 - ${field.max})"
                               min="0"
                               max="${field.max}"
                               oninput="calculatePercentage()">
                    </div>
                `;
            });

            container.innerHTML = html;
            calculatePercentage();
        }

        function calculatePercentage() {
            const subjectVal = document.getElementById('subject').value;
            const fields = subjectConfigs[subjectVal];
            let totalWeightedPercentage = 0;

            fields.forEach(field => {
                const input = document.getElementById(field.id);
                if (input) {
                    let val = parseFloat(input.value);
                    if (isNaN(val) || val < 0) val = 0;
                    if (val > field.max) {
                        val = field.max;
                        input.value = field.max;
                    }
                    const fieldPercentage = (val / field.max) * 100;
                    totalWeightedPercentage += fieldPercentage * field.weight;
                }
            });

            document.getElementById('finalResult').textContent = totalWeightedPercentage.toFixed(2) + '%';
        }

        createParticles();
        handleSubjectChange();
    </script>
</body>
</html>
